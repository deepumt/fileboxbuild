name: Build filebox:run

on:
  push:
  pull_request:

jobs:
  build-and-export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build -t filebox:run .

      - name: Export and Compress Image
        run: |
          docker save filebox:run | gzip > filebox-run.tar.gz
          ls -lh filebox-run.tar.gz

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: filebox-run-image
          path: filebox-run.tar.gz
          retention-days: 7
